{{ $ziel := .Get "ziel" | default "#" }}
{{ $text := .Get "text" | default "Klick hier" }}

<style>
  .orange-button {
    display: inline-block;
    padding: 8px 20px;
    background: #EF8023 !important;
    color: #fff !important;
    text-decoration: none;
    border: 2px solid #EF8023;
    border-radius: 6px;
    font-weight: bold;
    transition: background 0.2s, color 0.2s;
  }
  .orange-button:hover {
    background: #fff !important;
    color: #EF8023 !important;
  }
</style>

<a href="{{ $ziel }}" class="orange-button">
  {{ $text }}
</a>
